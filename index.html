<title>Sneaker Warehouse</title>
<style>
:root{
  --bg:#f2efe8;--card:#fffdf8;--ink:#17140f;--mute:#6d675c;--line:#d8d2c4;--soft:#ebe6da;
  --acc:#f2500f;--acc-ink:#fff;--ok:#1c8048;--warn:#a86c00;--bad:#c12a2a;
  --ok-bg:#e2f3e8;--warn-bg:#fbf0d4;--bad-bg:#fbe3e0;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px;--tab:62px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12110f;--card:#1c1a16;--ink:#f1ece2;--mute:#9b9488;--line:#37322a;--soft:#26231e;
  --acc:#ff6a2b;--acc-ink:#160c05;--ok:#4cc27f;--warn:#e3b04a;--bad:#f07a70;
  --ok-bg:#173524;--warn-bg:#3a2f12;--bad-bg:#421d1a;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2 .n{background:var(--ink);color:var(--bg);border-radius:99px;padding:1px 8px;font-size:12px;letter-spacing:0}
h2 .sp{flex:1}
a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 14px 8px}
.logo{font-weight:800;letter-spacing:.14em;font-size:14px;flex:1;white-space:nowrap}
.logo b{color:var(--acc);font-weight:800}
.top button{background:none;border:1px solid transparent;color:inherit;border-radius:8px;padding:6px 8px;display:flex;align-items:center;gap:6px;font-size:12px}
.top button:active{border-color:currentColor}
.top svg,.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#syncBtn.busy svg{animation:spin 1s linear infinite}
#syncBtn.err{color:var(--bad)}
@keyframes spin{to{transform:rotate(360deg)}}
main{max-width:920px;margin:0 auto;padding:14px 14px 30px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;color:var(--mute);position:relative}
.tabs button.on{color:var(--ink);font-weight:700}
.tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--acc)}
.tabs .dot{position:absolute;top:8px;left:calc(50% + 8px);background:var(--acc);color:var(--acc-ink);border-radius:99px;font-size:10px;min-width:16px;height:16px;line-height:16px;padding:0 4px;font-weight:700}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card.tight{padding:10px 12px}
.btn{border:1px solid var(--ink);background:var(--card);border-radius:10px;padding:11px 14px;font-weight:650;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{border-color:var(--line);font-weight:500}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:14px;border-radius:8px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.btn:active{transform:translateY(1px)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.nw{flex-wrap:nowrap}
.row>.grow{flex:1;min-width:0}
.cap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cap .btn{flex-direction:column;gap:4px;padding:14px 8px;font-size:15px}
.cap .btn small{font-weight:400;font-size:12px;opacity:.8}
.cap .btn.pri{grid-column:1/-1;font-size:18px;padding:20px 8px}
.cap svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note{font-size:13px;color:var(--mute)}
.banner{border-radius:var(--r);padding:10px 12px;margin:10px 0;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-bg);color:var(--ink);border:1px solid var(--warn)}
.banner.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.banner.info{background:var(--soft);border:1px solid var(--line)}
.banner .grow{flex:1;min-width:180px}

/* Formular */
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
.fld{grid-column:span 4;min-width:0}
.fld.h{grid-column:span 2}.fld.q{grid-column:span 1}
.fld>label:not(.chk),.lbl{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.fld .req{color:var(--acc)}
input[type=text],input[type=date],input[type=search],input[type=password],input[type=url],select,textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px;font-size:16px;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
input.mono{font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
input.miss{border-color:var(--bad);background:var(--bad-bg)}
textarea{min-height:64px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;min-height:42px;font-size:14px}
.chk input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px;font-size:13px;min-height:30px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.card>summary{cursor:pointer;font-weight:650;list-style:none;display:flex;gap:8px;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";margin-left:auto;font-size:20px;color:var(--mute)}
details.card[open]>summary::after{content:"–"}
details.card[open]>summary{margin-bottom:12px}

/* Listen */
.it{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin:8px 0;width:100%;text-align:left}
.it .th{width:54px;height:54px;border-radius:8px;background:var(--soft);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:11px;overflow:hidden}
.it .th img{width:100%;height:100%;object-fit:cover}
.it .mid{flex:1;min-width:0}
.it .t{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{font-size:13px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.it .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.it .r small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.sku{font-family:var(--mono);font-size:12.5px;background:var(--ink);color:var(--bg);padding:1px 6px;border-radius:4px;letter-spacing:.03em;white-space:nowrap}
.sz{font-family:var(--mono);font-size:12.5px;border:1px solid var(--ink);padding:0 5px;border-radius:4px;white-space:nowrap}
.tag{font-size:12px;border-radius:99px;padding:1px 8px;white-space:nowrap;border:1px solid var(--line)}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tag.busy::before{content:"";display:inline-block;width:9px;height:9px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:5px;animation:spin .8s linear infinite;vertical-align:-1px}
.lv{display:inline-flex;gap:2px;vertical-align:middle}
.lv i{width:6px;height:10px;border-radius:2px;background:var(--line)}
.lv.l1 i:nth-child(-n+1){background:var(--warn)}
.lv.l2 i:nth-child(-n+2){background:var(--ok)}
.lv.l3 i{background:var(--ok)}
.empty{text-align:center;color:var(--mute);padding:28px 10px;border:1px dashed var(--line);border-radius:var(--r);font-size:14px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.filters .chip{flex:none}
.filters select{width:auto;min-height:30px;padding:3px 26px 3px 10px;font-size:13px;border-radius:99px;background:var(--card)}

/* Prüfkette */
.ev{list-style:none;margin:0;padding:0;font-size:14px}
.ev li{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.ev li:last-child{border:0}
.ev .i{flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;margin-top:1px}
.ev .y .i{background:var(--ok)}.ev .n .i{background:var(--bad)}.ev .u .i{background:var(--mute)}
.verd{display:flex;gap:10px;align-items:center;font-weight:700;margin-bottom:6px}
.verd .pill{padding:3px 10px;border-radius:99px;font-size:13px}
.v3 .pill,.v2 .pill{background:var(--ok);color:#fff}.v1 .pill{background:var(--warn);color:#fff}.v0 .pill{background:var(--bad);color:#fff}
.shot{width:100%;max-height:230px;object-fit:contain;background:#000;border-radius:10px;display:block}
.cand{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;margin:6px 0;width:100%;text-align:left;background:var(--card)}
.cand.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.cand img{width:64px;height:48px;object-fit:contain;background:#fff;border-radius:6px;flex:none}

/* Sheets */
#sheets .sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--bg);width:100%;max-width:720px;max-height:94vh;max-height:94dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:760px){#sheets .sheet{align-items:center}.sheet-card{border-radius:18px;max-height:90dvh}}
.sheet-card>header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.sheet-card>header h3{flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-card>header .x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.sheet-body{padding:14px;overflow:auto;-webkit-overflow-scrolling:touch;flex:1}
.sheet-card>footer{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card);display:flex;gap:8px}
.sheet-card>footer .btn{flex:1}
.sheet.dlg{align-items:center!important;padding:20px}
.sheet.dlg .sheet-card{border-radius:16px;max-width:420px}
.zoom{position:fixed;inset:0;z-index:80;background:#000;overflow:auto;-webkit-overflow-scrolling:touch}
.zoom img{width:220%;max-width:none;display:block}
.zoom button{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:2;border:0;border-radius:50%;width:40px;height:40px;font-size:20px;background:#fff;color:#000}
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--tab) + 12px + env(safe-area-inset-bottom));z-index:90;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;max-width:520px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}.toast.ok{background:var(--ok);color:#fff}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.kpi .v{font-size:21px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:12px;color:var(--mute)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mute);gap:3px}
.bars .b i{display:block;width:100%;background:var(--ok);border-radius:4px 4px 0 0;min-height:2px}
.bars .b i.neg{background:var(--bad)}
.bars .b span{font-variant-numeric:tabular-nums;color:var(--ink);font-size:11px}
.hb{display:grid;grid-template-columns:minmax(70px,30%) 1fr auto;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.hb .tr{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--ink)}
.hb b{font-variant-numeric:tabular-nums;font-weight:600}
table.map{width:100%;border-collapse:collapse;font-size:14px}
table.map td{padding:4px 2px;border-bottom:1px solid var(--line);vertical-align:middle}
table.map select{min-height:36px;padding:4px 8px;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.hide{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="logo">SNEAKER<b>WAREHOUSE</b></div>
  <button id="syncBtn" class="hide" data-act="syncNow" title="Synchronisieren"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg></button>
  <button data-act="nav" data-view="settings" title="Einstellungen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.3l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2.2-1.3L14 3h-4l-.4 2.5a7 7 0 0 0-2.2 1.3l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2.6l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2.2 1.3L10 21h4l.4-2.5a7 7 0 0 0 2.2-1.3l2.3 1 2-3.4-2-1.5c.1-.4.1-.9.1-1.3z"/></svg></button>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-act="nav" data-view="capture"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 9v6M11 9v6M14 9v6M16.5 9v6"/></svg>Erfassen<span class="dot hide" id="dotCap"></span></button>
  <button data-act="nav" data-view="inventory"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Bestand</button>
  <button data-act="nav" data-view="sales"><svg viewBox="0 0 24 24"><path d="M4 7h13l3 4v6H4z"/><circle cx="8" cy="18" r="2"/><circle cx="16" cy="18" r="2"/><path d="M9 11h4"/></svg>Verkauf</button>
  <button data-act="nav" data-view="returns"><svg viewBox="0 0 24 24"><path d="M9 14l-5-5 5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Retouren<span class="dot hide" id="dotRet"></span></button>
  <button data-act="nav" data-view="dash"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Übersicht</button>
</nav>
<div id="sheets"></div>
<div id="toasts"></div>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fGal" accept="image/*" multiple hidden>
<input type="file" id="fShoe" accept="image/*" hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>
<input type="file" id="fCsv" accept=".csv,text/csv,text/plain" hidden>
<script>
/* ---- 01-core.js ---- */
'use strict';
const APP_VERSION = '8.0';

/* ================= Helfer ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nowISO = () => new Date().toISOString();
const pad2 = n => String(n).padStart(2, '0');
const isoDay = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const today = () => isoDay(new Date());
const sleep = ms => new Promise(r => setTimeout(r, ms));

/** Zahl aus deutscher oder englischer Schreibweise ("129,90" / "1.299,00" / "129.90"). */
function num(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  if (v == null) return 0;
  let s = String(v).trim().replace(/[^\d.,-]/g, '');
  if (!s) return 0;
  if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(/,/g, '');
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
const r2 = n => Math.round(n * 100) / 100;
const EUR = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
const eur = n => EUR.format(n || 0);
const eur0 = n => new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n || 0);

/** Beliebige Datumsschreibweise → "YYYY-MM-DD" (oder ""). */
function toISODate(v) {
  if (!v) return '';
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]);
  m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
  if (m) return (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + pad2(m[2]) + '-' + pad2(m[1]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) return (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + pad2(m[1]) + '-' + pad2(m[2]);
  const d = new Date(s);
  return isNaN(d) ? '' : isoDay(d);
}
const dDE = iso => { const s = toISODate(iso); return s ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4) : ''; };
function daysSince(iso) {
  const s = toISODate(iso); if (!s) return null;
  const a = new Date(s + 'T00:00:00'), b = new Date(today() + 'T00:00:00');
  return Math.round((b - a) / 864e5);
}

/* ---- CSV ---- */
function csvOut(rows, sep = ';') {
  const q = v => { const s = String(v ?? ''); return /["\n\r;,]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return '﻿' + rows.map(r => r.map(q).join(sep)).join('\r\n');
}
function csvIn(text) {
  text = String(text).replace(/^﻿/, '');
  const head = text.split(/\r?\n/, 1)[0] || '';
  const cnt = c => head.split(c).length - 1;
  const sep = cnt(';') >= cnt(',') && cnt(';') >= cnt('\t') && cnt(';') > 0 ? ';' : (cnt('\t') > cnt(',') ? '\t' : ',');
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

/* ================= Speicher (IndexedDB, Fallback localStorage) ================= */
const DB = {
  db: null, mem: new Map(),
  open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open('sneaker-warehouse', 1);
        rq.onupgradeneeded = () => { const d = rq.result; for (const s of ['kv', 'img']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
        rq.onsuccess = () => { this.db = rq.result; res(true); };
        rq.onerror = () => res(false); rq.onblocked = () => res(false);
      } catch (e) { res(false); }
    });
  },
  get(store, key) {
    if (!this.db) { if (store !== 'kv') return Promise.resolve(this.mem.get(key) ?? null); try { return Promise.resolve(JSON.parse(localStorage.getItem('sw8:' + key) || 'null')); } catch (e) { return Promise.resolve(null); } }
    return new Promise((res, rej) => { const rq = this.db.transaction(store).objectStore(store).get(key); rq.onsuccess = () => res(rq.result ?? null); rq.onerror = () => rej(rq.error); });
  },
  put(store, key, val) {
    if (!this.db) { if (store !== 'kv') this.mem.set(key, val); else try { localStorage.setItem('sw8:' + key, JSON.stringify(val)); } catch (e) {} return Promise.resolve(); }
    return new Promise((res, rej) => { const t = this.db.transaction(store, 'readwrite'); t.objectStore(store).put(val, key); t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  },
  putMany(store, entries) {
    if (!this.db) return Promise.all(entries.map(([k, v]) => this.put(store, k, v)));
    return new Promise((res, rej) => { const t = this.db.transaction(store, 'readwrite'), os = t.objectStore(store); entries.forEach(([k, v]) => os.put(v, k)); t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  },
  del(store, key) {
    if (!this.db) { if (store !== 'kv') this.mem.delete(key); else localStorage.removeItem('sw8:' + key); return Promise.resolve(); }
    return new Promise((res, rej) => { const t = this.db.transaction(store, 'readwrite'); t.objectStore(store).delete(key); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
  }
};

async function loadState() {
  await DB.open();
  for (const k of PERSIST) {
    const v = await DB.get('kv', k);
    if (v == null) continue;
    if (k === 'settings') S.settings = { ...S.settings, ...v, batch: { ...(v.batch || {}) } };
    else if (k === 'lists') S.lists = { ...S.lists, ...v };

const _dirty = new Set(); let _saveT = 0;
function save(...keys) {
  keys.forEach(k => _dirty.add(k));
  clearTimeout(_saveT); _saveT = setTimeout(flush, 0);
  if (keys.some(k => SYNCED.includes(k)) && typeof scheduleSync === 'function') scheduleSync();
}
async function flush() {
  clearTimeout(_saveT);
  const ks = [..._dirty]; _dirty.clear(); if (!ks.length) return;
  try { await DB.putMany('kv', ks.map(k => [k, S[k]])); }
  catch (e) { console.error('save', ks, e); ks.forEach(k => _dirty.add(k)); toast('Speichern fehlgeschlagen – bitte Backup sichern und Seite neu laden.', 'bad', 6000); }
}

function retLeft(it) {

/* ================= SKU- und Barcode-Regeln (rein rechnerisch, ohne KI) ================= */
const BRAND_ALIASES = [
  ['Jordan', /jordan/i], ['Nike', /nike/i], ['Yeezy', /yeezy/i], ['adidas', /adidas/i], ['New Balance', /new\s*balance|^nb$/i],
  ['ASICS', /asics|onitsuka/i], ['Puma', /puma/i], ['Converse', /converse/i], ['Vans', /vans/i], ['Reebok', /reebok/i],
  ['Salomon', /salomon/i], ['On', /^on(\s|$)|on running/i], ['Saucony', /saucony/i], ['HOKA', /hoka/i], ['UGG', /ugg/i],
  ['Crocs', /crocs/i], ['Timberland', /timberland/i], ['Birkenstock', /birkenstock/i], ['Under Armour', /under\s*armou?r/i], ['Mizuno', /mizuno/i]

function normBrand(b) {
  const s = String(b || '').trim(); if (!s) return '';
  for (const [name, re] of BRAND_ALIASES) if (re.test(s)) return name;
  return s.replace(/\s+/g, ' ');
}
const skuKey = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const RE_NIKE = /^(?:[A-Z]{2}\d{4}|\d{6})-\d{3}$/, RE_ASICS = /^\d{4}[A-Z]\d{3}-\d{3}$/, RE_PUMA = /^\d{6}-\d{2}$/;
const SKU_RULES = {
  Nike: RE_NIKE, Jordan: RE_NIKE,
  adidas: /^(?=.*[A-Z])(?=.*\d)[A-Z0-9]{6}$/, Yeezy: /^(?=.*[A-Z])(?=.*\d)[A-Z0-9]{6}$/, Reebok: /^(?:(?=.*[A-Z])(?=.*\d)[A-Z0-9]{6}|\d{9})$/,
  'New Balance': /^[A-Z]{1,4}\d{3,5}[A-Z0-9]{0,4}$/, ASICS: RE_ASICS, Puma: RE_PUMA,
  Converse: /^[A-Z]?\d{5,6}[A-Z]$/, Vans: /^VN[A-Z0-9]{6,12}$/, Salomon: /^L?\d{8}$/
};
const SKU_HINT = { Nike: 'DD1391-100', Jordan: 'DZ5485-612', adidas: 'GW2871', Yeezy: 'HQ4540', 'New Balance': 'U9060BLK', ASICS: '1201A789-020', Puma: '374915-01', Converse: '162050C', Vans: 'VN0A4BV4VXL', Salomon: 'L41750800' };

/** Schreibweise vereinheitlichen (Bindestrich/Leerzeichen/Punkt) – ändert keine Zeichen. */
function canonSku(brand, raw) {
  let s = String(raw || '').toUpperCase().trim().replace(/[‐‑‒–—]/g, '-').replace(/\s+/g, ' ');
  if (!s) return '';
  const k = skuKey(s), b = normBrand(brand);
  let m;
  if ((m = k.match(/^([A-Z]{2}\d{4}|\d{6})(\d{3})$/)) && (b === 'Nike' || b === 'Jordan' || (!SKU_RULES[b] && /^[A-Z]{2}/.test(k)))) return m[1] + '-' + m[2];
  if ((m = k.match(/^(\d{4}[A-Z]\d{3})(\d{3})$/))) return m[1] + '-' + m[2];
  if (b === 'Puma' && (m = k.match(/^(\d{6})(\d{2})$/))) return m[1] + '-' + m[2];
  if (['adidas', 'Yeezy', 'New Balance', 'Converse', 'Vans', 'Salomon'].includes(b)) return k;
  return s.replace(/\s*-\s*/g, '-').replace(/[ .]/g, '-');
}
/** true = passt zum Markenmuster, false = passt nicht, null = Marke ohne bekanntes Muster */
function validateSku(brand, sku) {
  const re = SKU_RULES[normBrand(brand)]; if (!re) return null;
  return re.test(canonSku(brand, sku));
}

async function loadBitmap(file) {

    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); }; im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Bildformat nicht lesbar')); };
    im.src = url;

}
function drawScaled(src, max) {
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
  const k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}

    if (p.color && !f.color) f.color = p.color;
    if (p.retail != null && p.retail !== '') { f.retail = num(p.retail); f.retailCur = p.retailCur || 'USD'; }
    if (p.release) f.releaseDate = p.release;
  };

  /* 1) Eigener Katalog: schon einmal bestätigt erfasst */
  const own = key && S.catalog[key];
  if (own && own.lvl >= 2) {
    fill({ title: own.name, brand: own.brand, color: own.color, retail: own.retail, retailCur: own.retailCur, release: own.release });
    if (own.model && !f.model) f.model = own.model;
    sx = own.sx ? { ...own.sx, vid: '' } : null;
    lvl = 2; add(true, `Bereits im eigenen Katalog bestätigt (${own.n || 1}× erfasst)`);
    const known = gt && own.gt && own.gt[gtinCore(gt)];
    if (known) { lvl = 3; add(true, 'Barcode ist für diese SKU bereits bekannt'); if (sx && known.vid) sx.vid = known.vid; }
  }

  /* 2) StockX */
  if (SX.on() && !opt.noSx && (lvl < 3)) {
    try {
      let match = [], prod = null, variant = null;
      if (lvl < 2 && key && !/\?/.test(f.sku)) {
        const hit = async q => (await SX.search(q, 10)).filter(p => styleKeys(p.sku).includes(skuKey(q)));
        match = await hit(f.sku);
        if (!match.length) {
          const alts = [...new Set([...(inp.alts || []).map(a => repairSku(f.brand, a).sku), ...skuVariants(f.sku, 4)])].filter(a => a && skuKey(a) !== key).slice(0, 5);
          for (const a of alts) {
            const m = await hit(a);
            if (m.length) { add(null, `SKU laut StockX: „${canonSku(f.brand, m[0].sku.split('/')[0])}“ (gelesen: „${f.sku}“ – verwechselbares Zeichen)`); f.sku = canonSku(f.brand, a); match = m; break; }
          }
        }
      }
      if (gt) {
        variant = await SX.gtin(gt);
        if (variant) {
          const byG = match.find(p => p.pid === variant.pid) || (sx && sx.pid === variant.pid ? { pid: sx.pid, own: true } : null) || await SX.product(variant.pid);
          if (byG && byG.own) { lvl = 3; add(true, 'StockX: Barcode gehört zu dieser SKU'); }
          else if (byG && (match.some(p => p.pid === byG.pid) || styleKeys(byG.sku).includes(skuKey(f.sku)))) { prod = byG; lvl = 3; add(true, `StockX: SKU gefunden – ${byG.title}`); add(true, 'StockX: Barcode gehört zu genau dieser SKU'); }
          else if (byG) {
            const read = f.sku, gsku = canonSku(byG.brand, String(byG.sku).split('/')[0]);
            prod = byG; f.sku = gsku;
            if (!read) { lvl = 2; add(true, `SKU über den Barcode ermittelt: ${gsku} – ${byG.title}`); }
            else if (match.length || lvl >= 2) { conflict = true; lvl = 1; cands = [byG, ...match]; add(false, `Widerspruch: Der Barcode gehört laut StockX zu „${gsku}“ (${byG.title}), auf dem Label gelesen wurde „${read}“ (${match[0] ? match[0].title : (own && own.name) || 'im eigenen Katalog'}). Bitte am Foto prüfen und den richtigen Treffer wählen.`); }
            else if (nearSku(read, gsku)) { lvl = 2; add(null, `Lesefehler korrigiert: Barcode gehört laut StockX zu „${gsku}“ (gelesen: „${read}“)`); }
            else { conflict = true; lvl = 1; cands = [byG]; add(false, `Die gelesene SKU „${read}“ kennt StockX nicht; der Barcode gehört zu „${gsku}“ (${byG.title}). Bitte am Foto prüfen.`); }
          }
        } else add(null, 'Barcode ist bei StockX nicht hinterlegt');
      }
      if (!prod && match.length && lvl < 2) {
        prod = match[0]; lvl = 2; add(true, `StockX: SKU gefunden – ${prod.title}`);
        if (match.length > 1) { cands = match; add(null, `${match.length} StockX-Einträge mit dieser SKU – bitte den passenden wählen`); }
      }
      if (!prod && !variant && lvl < 2 && key) add(false, 'Bei StockX nicht gefunden');
      if (prod) {
        fill({ ...prod, retailCur: 'USD' });
        sx = { pid: prod.pid, url: prod.url, img: prod.img, title: prod.title, vid: '' };
      }
      /* Größe/Variante */
      if (sx && sx.pid) {
        if (!variant && (f.size || f.sizeUS)) {
          try {
            const vs = await SX.variants(sx.pid);
            variant = vs.find(v => f.sizeUS && (v.sz.us === f.sizeUS || v.sz.usw === f.sizeUS || v.value === f.sizeUS) && (!f.size || !v.sz.eu || sizeVal(v.sz.eu) === sizeVal(f.size)))
              || vs.find(v => f.size && v.sz.eu && sizeVal(v.sz.eu) === sizeVal(f.size)) || null;
          } catch (e) {}
        }
        if (variant) {
          sx.vid = variant.vid;
          if (f.size && variant.sz.eu && sizeVal(variant.sz.eu) !== sizeVal(f.size)) add(false, `Größe prüfen: Label EU ${f.size}, StockX-Variante EU ${variant.sz.eu}`);
          else if (variant.sz.eu || variant.sz.us) add(true, `Größe passt zur StockX-Variante (EU ${variant.sz.eu || '–'} / US ${variant.sz.us || variant.value || '–'})`);
          if (!f.size && variant.sz.eu) f.size = variant.sz.eu;
          if (!f.sizeUS && (variant.sz.us || variant.value)) f.sizeUS = variant.sz.us || variant.value;
          if (!f.sizeUK && variant.sz.uk) f.sizeUK = variant.sz.uk;
        }
      }
    } catch (e) { add(null, 'StockX-Prüfung nicht möglich: ' + errMsg(e)); }
  } else if (!SX.on() && lvl < 2) add(null, 'StockX ist nicht angebunden – keine Katalogprüfung');

  return { f, ev, lvl, sx, cands, conflict };
}

/** Ersatzweg ohne StockX: Websuche bestätigt, dass es die SKU gibt. */
async function webConfirm(r, hint) {
  try {
    const w = await AI.webSku(r.f.sku, r.f.brand, hint || r.f.model || '');
    if (w && w.found && skuKey(w.sku) === skuKey(r.f.sku)) {
      if (w.name && !r.f.name) r.f.name = w.name;
      if (w.brand && !r.f.brand) r.f.brand = normBrand(w.brand);
      if (w.colorway && !r.f.color) r.f.color = w.colorway;
      if (w.retail_price != null && r.f.retail == null) { r.f.retail = num(w.retail_price); r.f.retailCur = w.retail_currency === 'EUR' ? 'EUR' : 'USD'; }
      if (w.release_date && !r.f.releaseDate) r.f.releaseDate = toISODate(w.release_date);
      r.ev.push({ ok: true, t: 'Websuche: SKU existiert – ' + (w.name || ''), url: /^https?:\/\//.test(w.source_url || '') ? w.source_url : '' });
      r.lvl = Math.max(r.lvl, 1);
    } else if (w && w.found && w.sku) r.ev.push({ ok: false, t: `Websuche fand nur eine abweichende SKU („${w.sku}“ – ${w.name || ''})` });
    else r.ev.push({ ok: false, t: 'Websuche konnte die SKU nicht bestätigen' });
  } catch (e) { r.ev.push({ ok: null, t: 'Websuche nicht möglich: ' + errMsg(e) }); }
  return r;
}

/** Bestätigte SKU im eigenen Katalog merken – beschleunigt und sichert jede weitere Erfassung. */
function rememberCatalog(it) {
  const key = skuKey(it.sku); if (!key) return;
  if (!it.ver || !(it.ver.lvl >= 2 || it.ver.user)) return; // nur belegte oder ausdrücklich am Label geprüfte SKUs
  const lvl = Math.max(it.ver.lvl || 0, 2);
  const c = S.catalog[key] || { n: 0, gt: {} };
  Object.assign(c, { sku: it.sku, brand: it.brand, name: it.name, model: it.model || c.model || '', color: it.color || c.color || '',
    retail: it.retail !== '' && it.retail != null ? it.retail : c.retail, retailCur: it.retailCur || c.retailCur, release: it.releaseDate || c.release || '',
    sx: it.sx && it.sx.pid ? { pid: it.sx.pid, url: it.sx.url, img: it.sx.img, title: it.sx.title } : (c.sx || null), lvl, at: nowISO() });
  c.n = (c.n || 0) + 1;
  if (it.gtin && gtinValid(it.gtin)) { c.gt = c.gt || {}; c.gt[gtinCore(it.gtin)] = { eu: it.size, us: it.sizeUS || '', vid: (it.sx && it.sx.vid) || '' }; }
  S.catalog[key] = c;
}

/* ================= Erfassen ================= */
const WORK = { running: 0, queue: [] };
const draftById = id => S.drafts.find(d => d.id === id);
function newDraft(src) { return { id: uid(), at: nowISO(), src, st: 'queued', f: {}, ev: [], lvl: 0, cands: [], touched: {}, err: '', sx: null }; }

async function addPhotos(files, src) {
  if (!files.length) return;
  if (!AI.ready()) { toast('KI ist nicht eingerichtet – bitte zuerst in den Einstellungen.', 'bad'); return; }
  for (const file of files) {
    try {
      const jpg = await fileToJpeg(file, 1600, 0.86);
      const d = newDraft(src);
      await DB.put('img', 'w:' + d.id, jpg);
      S.drafts.unshift(d); enqueue(d.id);
    } catch (e) { toast('Bild nicht lesbar: ' + (file.name || ''), 'bad'); }
  }
  save('drafts'); if (S.ui.view !== 'capture') go('capture'); else renderInbox();
}
function enqueue(id) { WORK.queue.push(id); pump(); }
function pump() {
  while (WORK.running < 2 && WORK.queue.length) {
    const id = WORK.queue.shift(); WORK.running++;
    processDraft(id).catch(e => console.error(e)).finally(() => { WORK.running--; pump(); });
  }
}
function draftChanged(d) { save('drafts'); renderInbox(); refreshReview(d.id); }

async function processDraft(id) {
  const d = draftById(id); if (!d) return;
  try {
    const img = await DB.get('img', 'w:' + id);
    if (!img) throw new AppErr('Foto nicht mehr vorhanden – bitte neu aufnehmen.');
    d.st = 'reading'; d.err = ''; draftChanged(d);
    if (d.src === 'shoe') return await processShoe(d, img);
    const [labels, codes] = await Promise.all([AI.readLabels(img), detectBarcodes(img)]);
    const all = [d];
    for (let i = 1; i < labels.length; i++) {
      const x = newDraft('label'); x.st = 'reading'; x.multi = i + 1;
      await DB.put('img', 'w:' + x.id, img);
      S.drafts.splice(S.drafts.indexOf(d) + i, 0, x); all.push(x);
    }
    if (labels.length > 1) d.multi = 1;
    await Promise.all(all.map((x, i) => resolveLabelDraft(x, labels[i], codes, img, labels.length).catch(e => { x.st = 'error'; x.err = errMsg(e); draftChanged(x); })));
  } catch (e) { d.st = 'error'; d.err = errMsg(e); draftChanged(d); }
}

async function resolveLabelDraft(x, L, codes, img, n) {
  x.raw = L; x.st = 'resolving'; draftChanged(x);
  let gt = gtinClean(L.barcode_digits), gtSrc = 'ki';
  if (codes.length === 1 && n === 1) { gt = codes[0]; gtSrc = 'scan'; }
  else if (codes.some(c => sameGtin(c, gt))) gtSrc = 'scan';
  const inp = { sku: L.style_code || '', alts: L.style_code_alternatives || [], brand: L.brand, gtin: gt, gtSrc, model: L.model_text, color: L.colorway_text,
    sizeEU: L.size_eu, sizeUS: L.size_us, sizeUK: L.size_uk, sizeCM: L.size_cm };
  let r = await resolveSku(inp);
  if (L.confidence === 'low' && r.lvl < 2) r.ev.push({ ok: false, t: 'KI ist sich bei der SKU unsicher' + (L.notes ? ': ' + L.notes : '') });
  /* Zweite Lesung, wenn kein Katalog die SKU belegt */
  if (r.lvl < 2 && !r.conflict && S.settings.doubleRead && n === 1 && skuKey(r.f.sku)) {
    try {
      const s2 = repairSku(r.f.brand, await AI.rereadSku(img)).sku;
      if (s2 && skuKey(s2) === skuKey(r.f.sku)) { r.ev.push({ ok: true, t: 'Zweite, unabhängige Lesung stimmt überein' }); r.lvl = Math.max(r.lvl, 1); }
      else if (s2) {
        const r2 = SX.on() ? await resolveSku({ ...inp, sku: s2, alts: [] }) : null;
        if (r2 && r2.lvl >= 2) { r2.ev.unshift({ ok: null, t: `Erste Lesung „${r.f.sku}“ verworfen – die zweite Lesung „${s2}“ wurde im Katalog bestätigt` }); r = r2; }
        else { r.ev.push({ ok: false, t: `Zwei Lesungen weichen voneinander ab: „${r.f.sku}“ und „${s2}“ – bitte am Foto prüfen` }); r.alt = s2; r.lvl = 0; }
      }
    } catch (e) { r.ev.push({ ok: null, t: 'Zweite Lesung nicht möglich: ' + errMsg(e) }); }
  }
  if (r.lvl < 2 && !r.conflict && S.settings.webLookup && skuKey(r.f.sku) && !/\?/.test(r.f.sku)) r = await webConfirm(r, L.model_text);
  applyResolve(x, r);
  x.st = 'ready'; draftChanged(x);
}
function applyResolve(d, r) {
  for (const [k, v] of Object.entries(r.f)) if (!d.touched[k] && v !== '' && v != null) d.f[k] = v;
  d.ev = r.ev; d.lvl = r.lvl; d.cands = r.cands || []; d.sx = r.sx || null; d.alt = r.alt || ''; d.verSku = d.f.sku || '';
}

async function processShoe(d, img) {
  const res = await AI.identifyShoe(img);
  d.raw = res; d.st = 'resolving'; draftChanged(d);
  let cands = [];
  if (SX.on()) {
    for (const c of res.candidates.slice(0, 3)) {
      try {
        (await SX.search(c.search_query || c.name, 5)).forEach(p => { if (!cands.some(x => x.pid === p.pid)) cands.push(p); });
      } catch (e) { d.ev.push({ ok: null, t: 'StockX-Suche nicht möglich: ' + errMsg(e) }); break; }
    }
  }
  if (!cands.length && S.settings.webLookup) {
    try {
      const w = await AI.webShoe(res.candidates.slice(0, 3).map(c => c.name).join(' / ') + (res.visible_colors ? ' – colours: ' + res.visible_colors : ''));
      cands = ((w && w.candidates) || []).filter(c => c.sku).map(c => ({ pid: '', url: /^https?:/.test(c.source_url || '') ? c.source_url : '', sku: c.sku, title: c.name, brand: c.brand, color: c.colorway, retail: c.retail_price, retailCur: c.retail_currency, release: toISODate(c.release_date), img: '' }));
    } catch (e) { d.ev.push({ ok: null, t: 'Websuche nicht möglich: ' + errMsg(e) }); }
  }
  d.cands = cands.slice(0, 8); d.f.brand = normBrand(res.brand); d.lvl = 0;
  d.ev.unshift({ ok: null, t: `Schuh-Foto: KI vermutet „${res.candidates[0].name}“. Bitte den passenden Treffer wählen. Größe und Barcode stehen nur auf dem Karton-Label.` });
  if (!cands.length) d.ev.push({ ok: false, t: 'Keine Katalogtreffer – SKU bitte von Hand eintragen' });
  d.st = 'ready'; draftChanged(d);
}

VIEWS.dash = () => {
  const items = live(S.items), sales = live(S.sales);
  const stock = items.filter(i => i.status === 'stock');
  const cap = stock.reduce((a, i) => a + buyNet(i), 0);
  const withBid = stock.filter(i => i.sx && i.sx.bid != null);
  const mv = withBid.reduce((a, i) => a + num(i.sx.bid), 0), mvCost = withBid.reduce((a, i) => a + buyNet(i), 0);
  const ym = today().slice(0, 7), yy = today().slice(0, 4);
  const pr = f => sales.filter(f).reduce((a, s) => a + saleProfit(s), 0);
  const rev = f => sales.filter(f).reduce((a, s) => a + saleNet(s), 0);
  const pM = pr(s => (s.date || '').startsWith(ym)), pY = pr(s => (s.date || '').startsWith(yy)), pAll = pr(() => true);
  const revAll = rev(() => true);
  const hold = sales.map(s => { const it = S.items.find(x => x.id === s.itemId); const a = it && toISODate(it.buyDate || it.createdAt), b = toISODate(s.date); return a && b ? Math.max(0, Math.round((new Date(b) - new Date(a)) / 864e5)) : null; }).filter(x => x != null);
  const due = items.map(it => ({ it, left: retLeft(it) })).filter(x => x.left != null).sort((a, b) => a.left - b.left);
  const refunds = items.filter(refundDue);
  const unver = stock.filter(i => !i.ver || (i.ver.lvl || 0) < 2 && !i.ver.user).length;

  /* letzte 6 Monate */
  const months = []; const d0 = new Date(); d0.setDate(1);
  for (let i = 5; i >= 0; i--) { const d = new Date(d0.getFullYear(), d0.getMonth() - i, 1); months.push(d.getFullYear() + '-' + pad2(d.getMonth() + 1)); }
  const mp = months.map(m => pr(s => (s.date || '').startsWith(m)));
  const mMax = Math.max(1, ...mp.map(Math.abs));
  const grp = (arr, key, val) => { const m = {}; arr.forEach(x => { const k = key(x) || '–'; m[k] = (m[k] || 0) + val(x); }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const hbars = (rows, fmt) => { const mx = Math.max(1, ...rows.map(r => Math.abs(r[1]))); return rows.slice(0, 7).map(([k, v]) => `<div class="hb"><span>${esc(k)}</span><span class="tr"><i style="width:${Math.max(2, Math.abs(v) / mx * 100)}%"></i></span><b>${fmt(v)}</b></div>`).join('') || '<div class="note">Noch keine Daten.</div>'; };
  const age = [['0–30 T', 0, 30], ['31–90 T', 31, 90], ['91–180 T', 91, 180], ['über 180 T', 181, 1e9]].map(([l, a, b]) => [l, stock.filter(i => { const d = daysSince(i.buyDate || i.createdAt) ?? 0; return d >= a && d <= b; }).length]);

  return `
  ${legacyBanner()}${backupBanner()}
  ${due.length ? `<div class="banner ${due[0].left <= 3 ? 'bad' : 'warn'}"><div class="grow"><b>${due.length} Rückgabefrist(en) laufen.</b> Nächste: ${esc(due[0].it.name || due[0].it.sku)} – ${due[0].left > 0 ? 'noch ' + due[0].left + ' Tag(e)' : due[0].left === 0 ? 'heute letzter Tag' : 'abgelaufen'}</div><button class="btn sm dark" data-act="nav" data-view="returns">Ansehen</button></div>` : ''}
  ${refunds.length ? `<div class="banner warn"><div class="grow"><b>${refunds.length} Erstattung(en) überfällig prüfen</b> – zusammen ${eur(refunds.reduce((a, i) => a + num(i.ret.refundAmt), 0))}</div><button class="btn sm dark" data-act="nav" data-view="returns">Ansehen</button></div>` : ''}
  <div class="kpis">
    <div class="kpi"><div class="l">Im Bestand</div><div class="v">${stock.length}</div><div class="d">gebunden ${eur0(cap)} netto</div></div>
    <div class="kpi"><div class="l">Marktwert (Gebote)</div><div class="v">${withBid.length ? eur0(mv) : '–'}</div><div class="d">${withBid.length ? `${withBid.length}/${stock.length} Paare · <span class="${mv - mvCost >= 0 ? 'pos' : 'neg'}">${mv - mvCost >= 0 ? '+' : ''}${eur0(mv - mvCost)}</span> ggü. EK` : 'StockX-Preise noch nicht geladen'}</div></div>
    <div class="kpi"><div class="l">Gewinn ${dDE(ym + '-01').slice(3)}</div><div class="v ${pM >= 0 ? 'pos' : 'neg'}">${eur0(pM)}</div><div class="d">Jahr ${yy}: ${eur0(pY)}</div></div>
    <div class="kpi"><div class="l">Gewinn gesamt</div><div class="v ${pAll >= 0 ? 'pos' : 'neg'}">${eur0(pAll)}</div><div class="d">${sales.length} ${sales.length === 1 ? 'Verkauf' : 'Verkäufe'} · Marge ${revAll ? Math.round(pAll / revAll * 100) : 0} % · Ø ${hold.length ? Math.round(hold.reduce((a, b) => a + b, 0) / hold.length) : '–'} T Lagerzeit</div></div>
  </div>
  ${SX.on() && stock.length ? `<button class="btn wide ghost" style="margin-top:8px" data-act="marketAll">StockX-Preise für den Bestand aktualisieren</button>` : ''}
  ${unver ? `<div class="banner info"><div class="grow"><b>${unver} Paar(e) im Bestand ohne belegte SKU.</b> ${SX.on() ? 'Jetzt gegen StockX prüfen?' : 'Mit StockX-Anbindung lassen sie sich automatisch prüfen.'}</div>${SX.on() ? '<button class="btn sm dark" data-act="verifyAll">Prüfen</button>' : ''}</div>` : ''}
  <h2>Gewinn je Monat</h2>
  <div class="card"><div class="bars">${months.map((m, i) => `<div class="b"><span>${mp[i] ? eur0(mp[i]) : ''}</span><i class="${mp[i] < 0 ? 'neg' : ''}" style="height:${Math.abs(mp[i]) / mMax * 78}%"></i>${m.slice(5)}/${m.slice(2, 4)}</div>`).join('')}</div></div>
  <h2>Bestand nach Marke</h2><div class="card">${hbars(grp(stock, i => i.brand, () => 1), v => v + ' Paar')}</div>
  <h2>Lagerdauer</h2><div class="card">${hbars(age, v => v + ' Paar')}</div>
  <h2>Gewinn nach Verkaufskanal</h2><div class="card">${hbars(grp(sales, s => s.platform, s => saleProfit(s)), v => eur0(v))}</div>`;
};
function backupBanner() {
  if (!live(S.items).length || (S.settings.sync && workerOn())) return '';

/* ---- Sync zwischen Geräten (über die Zwischenstation) ---- */
function mergeById(a, b) {
  const m = new Map(a.map(x => [x.id, x]));
  for (const y of b || []) { const x = m.get(y.id); if (!x || String(y.updatedAt || '') > String(x.updatedAt || '')) m.set(y.id, y); }
  return [...m.values()];
}
function mergeRemote(d) {
  if (!d) return;
  S.items = mergeById(S.items, d.items).sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
  S.sales = mergeById(S.sales, d.sales).sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
  for (const [k, c] of Object.entries(d.catalog || {})) if (!S.catalog[k] || String(c.at || '') > String(S.catalog[k].at || '')) S.catalog[k] = c;
  for (const k of Object.keys(d.lists || {})) (d.lists[k] || []).forEach(v => { const l = S.lists[k] || (S.lists[k] = []); if (!l.some(x => x.toLowerCase() === String(v).toLowerCase())) l.push(v); });
  const cut = new Date(Date.now() - 90 * 864e5).toISOString();
  S.items = S.items.filter(x => !(x._del && String(x.updatedAt) < cut)); S.sales = S.sales.filter(x => !(x._del && String(x.updatedAt) < cut));
}
const syncData = () => ({ items: S.items, sales: S.sales, catalog: S.catalog, lists: S.lists });
let _syncT = 0, _syncBusy = false, _syncAgain = false;
function scheduleSync(ms = 20000) { if (!S.settings.sync || !workerOn()) return; clearTimeout(_syncT); _syncT = setTimeout(() => syncNow(false), ms); }
function syncUI(state) { const b = $('#syncBtn'); if (!b) return; b.classList.toggle('hide', !(S.settings.sync && workerOn())); b.classList.toggle('busy', state === 'busy'); b.classList.toggle('err', state === 'err'); }
async function syncNow(manual) {
  if (!S.settings.sync || !workerOn()) { if (manual) toast('Sync ist nicht eingerichtet.'); return; }
  if (_syncBusy) { _syncAgain = true; return; }
  _syncBusy = true; syncUI('busy');
  const call = (opt = {}) => fetchT(workerBase() + '/sync', { ...opt, headers: { authorization: 'Bearer ' + S.settings.token, 'content-type': 'application/json', ...(opt.headers || {}) } }, 30000);
  try {
    await flush();
    let r = await call();
    if (r.status === 401) throw new AppErr('App-Passwort wird abgelehnt.');
    if (r.status === 501) throw new AppErr('Sync braucht den KV-Speicher an der Zwischenstation (siehe Anleitung).');
    let remote = r.ok ? await r.json() : null, rev = (remote && remote.rev) || '';
    const before = JSON.stringify(syncData());
    for (let i = 0; i < 3; i++) {
      if (remote && remote.data) mergeRemote(remote.data);
      const mine = JSON.stringify(syncData());
      if (remote && remote.data && mine === JSON.stringify(remote.data)) break;
      const p = await call({ method: 'PUT', headers: { 'if-match': rev }, body: JSON.stringify({ data: syncData() }) });
      if (p.status === 409) { remote = await p.json(); rev = remote.rev || ''; continue; }
      if (!p.ok) throw new AppErr('Sync-Fehler ' + p.status);
      break;
    }
    if (JSON.stringify(syncData()) !== before) { _dirty.add('items'); _dirty.add('sales'); _dirty.add('catalog'); _dirty.add('lists'); await flush(); if (!$('#sheets').children.length) render(); }
    S.meta.lastSync = nowISO(); _dirty.add('meta'); flush(); syncUI('ok');
    if (manual) toast('Synchronisiert', 'ok');
  } catch (e) { syncUI('err'); if (manual) toast('Sync: ' + errMsg(e), 'bad'); }
  finally { _syncBusy = false; if (_syncAgain) { _syncAgain = false; scheduleSync(3000); } }
}
ACT.syncNow = () => syncNow(true);

      <form method="post" target="_blank" action="${esc(workerBase())}/auth/start" style="display:inline" data-sxform><input type="hidden" name="t" value="${esc(s.token)}"><button class="btn sm" ${workerOn() ? '' : 'disabled'}>Mit StockX verbinden</button></form>
      ${s.sync && workerOn() ? '<button class="btn sm ghost" data-act="syncNow">Jetzt abgleichen</button>' : ''}</div>
    <div id="workerState" class="note" style="margin-top:8px">${S.meta.lastSync ? 'Letzter Abgleich: ' + new Date(S.meta.lastSync).toLocaleString('de-DE') : ''}</div>
  </div>

  <h2>Erfassung</h2>
  <div class="card">
    ${chk('doubleRead', 'Zweite Lesung, wenn kein Katalog die SKU belegt', 'Zwei unabhängige KI-Lesungen müssen übereinstimmen. Kostet einen zusätzlichen Aufruf.')}
    ${chk('webLookup', 'Websuche als Ersatz, wenn StockX nichts liefert', 'Langsamer und teurer als die StockX-Abfrage; erreicht höchstens „Plausibel“.')}
    ${chk('keepPhoto', 'Label-Foto verkleinert am Artikel behalten')}
    <div class="form" style="margin-top:8px">${txt('vat', 'MwSt-Satz in %', { w: 'h', numk: 1 })}${txt('retDays', 'Rückgabefrist in Tagen', { w: 'h', numk: 1 })}${txt('retGrace', 'Frist-Nachlauf in Tagen', { w: 'h', numk: 1 })}${txt('refundDelay', 'Erstattung prüfen nach Tagen', { w: 'h', numk: 1 })}</div>
  </div>

  <h2>Auswahllisten</h2>
  <div class="card"><div class="form">
    ${['locations', 'dealers', 'platforms'].map(k => `<div class="fld"><label>${{ locations: 'Lagerorte', dealers: 'Händler', platforms: 'Käufer / Plattformen' }[k]} (mit Komma getrennt)</label><input type="text" data-list="${k}" value="${esc((S.lists[k] || []).join(', '))}" autocomplete="off"></div>`).join('')}
  </div></div>

  <h2>Daten</h2>
  <div class="card">
    <div class="note" style="margin-bottom:10px">${n} Artikel · ${live(S.sales).length} Verkäufe · ${Object.keys(S.catalog).length} bestätigte SKUs im eigenen Katalog${S.meta.lastBackup ? ' · letztes Backup ' + dDE(S.meta.lastBackup) : ''}${DB.db ? '' : ' · <b>Achtung: Browser erlaubt nur flüchtigen Speicher (privater Modus?)</b>'}</div>
    <div class="row">
      <button class="btn sm dark" data-act="backupExport">Backup sichern</button><button class="btn sm" data-act="backupImport">Backup einspielen</button>
      <button class="btn sm" data-act="expInventory">Bestand als CSV</button><button class="btn sm" data-act="expSales">Verkäufe als CSV</button><button class="btn sm" data-act="csvImport">CSV importieren</button>
      ${legacyRead() ? '<button class="btn sm" data-act="legacyImport">Altdaten der bisherigen App übernehmen</button>' : ''}
      <button class="btn sm bad" data-act="wipe">Alles löschen</button>
    </div>
  </div>
  <p class="note" style="text-align:center">Sneaker Warehouse ${APP_VERSION} · Daten liegen in diesem Browser${s.sync && workerOn() ? ' und in deiner Zwischenstation' : ''}</p>`;
};
function setSetting(el) {
  const k = el.dataset.set; let v = el.type === 'checkbox' ? el.checked : el.value.trim();
  if (['vat', 'retDays', 'retGrace', 'refundDelay'].includes(k)) v = num(v);
  if (k === 'worker' && v && !/^https?:\/\//i.test(v)) v = 'https://' + v;
  S.settings[k] = v; save('settings');
  if (el.type === 'checkbox' || k === 'worker' || k === 'token') { if (el.type === 'checkbox') render(); else { const f = $('[data-sxform]'); if (f) { f.action = workerBase() + '/auth/start'; f.t.value = S.settings.token; $('button', f).disabled = !workerOn(); } } syncUI(); }
}
ACT.aiTest = async el => {
  el.disabled = true;
  try { const r = await AI.call({ max_tokens: 20, messages: [{ role: 'user', content: 'Antworte nur mit: OK' }] }); toast('KI erreichbar · Modell ' + (r.model || S.settings.aiModel), 'ok'); render(); }
  catch (e) { toast(errMsg(e), 'bad', 6000); el.disabled = false; }
};
ACT.aiModels = async () => {
  try {
    const s = S.settings; let r;
    if (s.aiViaWorker) r = await fetchT(workerBase() + '/ai/models', { headers: { authorization: 'Bearer ' + s.token } });
    else r = await fetchT('https://api.anthropic.com/v1/models?limit=100', { headers: { 'x-api-key': s.aiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' } });
    if (!r.ok) throw new AppErr('Modelle konnten nicht geladen werden (' + r.status + ').');
    const j = await r.json(); S.ui.models = (j.data || []).map(m => m.id).filter(Boolean);
    render(); toast(S.ui.models.length + ' Modelle geladen – im Feld „Modell“ auswählbar', 'ok');
  } catch (e) { toast(errMsg(e), 'bad'); }
};
ACT.workerTest = async () => {
  const box = $('#workerState');
  if (!workerOn()) { toast('Bitte Adresse und App-Passwort eintragen.', 'bad'); return; }
  box.textContent = 'Prüfe …';
  try {
    const r = await fetchT(workerBase() + '/health', { headers: { authorization: 'Bearer ' + S.settings.token } }, 15000);
    if (r.status === 401) throw new AppErr('App-Passwort wird abgelehnt.');
    if (!r.ok) throw new AppErr('Antwort ' + r.status + ' – stimmt die Adresse?');
    const h = await r.json(), y = b => b ? '✓' : '✗';
    box.innerHTML = `Zwischenstation erreichbar · StockX-Zugangsdaten ${y(h.stockxConfigured)} · StockX verbunden ${y(h.stockxConnected)} · KI-Key ${y(h.ai)} · Speicher für Sync ${y(h.kv)}` + (h.stockxConfigured && !h.stockxConnected ? '<br><b>Nächster Schritt:</b> „Mit StockX verbinden“ antippen und dort anmelden.' : '');
  } catch (e) { box.textContent = errMsg(e); }
};
ACT.wipe = async () => {
  if (!(await ask('Wirklich ALLE Artikel, Verkäufe und Einstellungen in diesem Browser löschen? Vorher ein Backup sichern!', { ok: 'Alles löschen', danger: true }))) return;
  if (!(await ask('Letzte Rückfrage: Das lässt sich nicht rückgängig machen.', { ok: 'Endgültig löschen', danger: true }))) return;
  for (const k of PERSIST) await DB.del('kv', k);
  location.reload();
};

/* ================= Rahmen ================= */
function render() {
  const v = S.ui.view;
  $('#view').innerHTML = (VIEWS[v] || VIEWS.capture)();
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  if (AFTER[v]) AFTER[v]();
  updateDots(); syncUI();
}
function go(view) { S.ui.view = view; render(); window.scrollTo(0, 0); }
ACT.nav = el => go(el.dataset.view);

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.tagName !== 'A') e.preventDefault();
  try { const p = f(el, e); if (p && p.catch) p.catch(err => { console.error(err); toast(errMsg(err), 'bad'); }); } catch (err) { console.error(err); toast(errMsg(err), 'bad'); }
});
function onField(e) {
  const el = e.target;
  if (el.dataset.inp && INP[el.dataset.inp]) return INP[el.dataset.inp](el);
  if (el.closest('[data-batch]')) return INP.batch();
  if (el.closest('[data-sale]')) return INP.sale();
  if (el.closest('.sheet[data-draft]')) return INP.draft(el);
}
document.addEventListener('input', onField);
document.addEventListener('change', e => {
  const el = e.target;
  if (el.type === 'file') return onFile(el);
  if (el.dataset.chg && CHG[el.dataset.chg]) return CHG[el.dataset.chg](el);
  if (el.dataset.set) return setSetting(el);
  if (el.dataset.list) { S.lists[el.dataset.list] = [...new Set(el.value.split(',').map(x => x.trim()).filter(Boolean))]; save('lists'); return; }
  if (el.type === 'checkbox' || el.type === 'date' || el.tagName === 'SELECT') onField(e);
});
document.addEventListener('toggle', e => { if (e.target.id === 'batchBox') S.ui.batchOpen = e.target.open; }, true);
function onFile(el) {
  const files = [...el.files]; el.value = ''; if (!files.length) return;
  if (el.id === 'fCam' || el.id === 'fGal') addPhotos(files, 'label');
  else if (el.id === 'fShoe') addPhotos(files.slice(0, 1), 'shoe');
  else if (el.id === 'fJson') handleJsonFile(files[0]);
  else if (el.id === 'fCsv') handleCsvFile(files[0]);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flush();
  else if (S.settings.sync && workerOn() && (!S.meta.lastSync || Date.now() - new Date(S.meta.lastSync) > 60000)) syncNow(false);
});
window.addEventListener('pagehide', () => flush());
window.addEventListener('error', e => console.error('Fehler:', e.message));

async function init() {
  await loadState();
  /* Unterbrochene Erfassungen wieder anstoßen */
  S.drafts.forEach(d => { if (['queued', 'reading', 'resolving'].includes(d.st)) { d.st = 'queued'; WORK.queue.push(d.id); } });
  render(); pump();
  const due = live(S.items).map(it => ({ it, left: retLeft(it) })).filter(x => x.left != null && x.left <= 3).sort((a, b) => a.left - b.left);
  if (due.length && S.meta.retPopup !== today()) {
    S.meta.retPopup = today(); save('meta');
    info(`<b>Rückgabefrist läuft ab:</b><br>` + due.slice(0, 8).map(x => `${esc(x.it.name || x.it.sku)} (EU ${esc(x.it.size)}) – ${x.left > 0 ? 'noch ' + x.left + ' Tag(e)' : x.left === 0 ? 'heute' : 'abgelaufen'}`).join('<br>'), true);
  }
  if (S.settings.sync && workerOn()) syncNow(false);
}
init().catch(e => { console.error(e); document.getElementById('view').innerHTML = '<div class="banner bad">Start fehlgeschlagen: ' + esc(e.message) + '</div>'; });
</script>
</body>
</html>
